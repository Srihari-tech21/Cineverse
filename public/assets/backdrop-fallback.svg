<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <radialGradient id="backdropGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#3A281E" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#211712" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#100D0B" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B58A62" stop-opacity="0" />
      <stop offset="50%" stop-color="#D0AA7A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B58A62" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Espresso Cinematic Canvas -->
  <rect width="1280" height="720" fill="url(#backdropGlow)" />

  <!-- Subtle Cinematic Vignette Lines -->
  <line x1="140" y1="360" x2="1140" y2="360" stroke="url(#goldH)" stroke-width="1" />

  <!-- Center Watermark -->
  <g transform="translate(640, 360)">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="-20" r="48" fill="#1A130E" stroke="rgba(208, 170, 122, 0.3)" stroke-width="2" />
    <circle cx="0" cy="-20" r="16" fill="#100D0B" stroke="#B58A62" stroke-width="1.5" />
    <circle cx="0" cy="-20" r="5" fill="#D0AA7A" />

    <!-- Brand Name -->
    <text x="0" y="55" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#D0AA7A" text-anchor="middle" letter-spacing="8">CINEVERSE</text>
    <text x="0" y="80" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8C7A6B" text-anchor="middle" letter-spacing="4">CINEMATIC SELECTION</text>
  </g>
</svg>
