<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CineVerse - Your ultimate movie discovery and entertainment management platform. Browse, rate, and review movies." />
    <!-- Prevent theme flash: apply theme before body render -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cineverse_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', saved);
          document.documentElement.className = saved;
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>CineVerse – Movie & Entertainment Portal</title>
  </head>
  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
